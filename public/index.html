<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Shelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand-link" href="index.html">Manhwa Shelf</a>
      <nav class="site-nav" aria-label="Navegacao principal">
        <a href="#catalog">Catalogo</a>
        <a href="#student">Aluno</a>
      </nav>
    </header>

    <main>
      <section class="home-hero" id="featuredPanel" aria-label="Manhwa em destaque"></section>

      <section class="content-section" id="catalog">
        <div class="section-heading">
          <p>Catalogo</p>
          <h2>Leituras coreanas populares</h2>
          <span id="catalogCount">0 itens</span>
        </div>
        <div class="reading-list" id="manhwaCards"></div>
      </section>

      <section class="content-section student-section" id="student">
        <div class="section-heading">
          <p>Autoria</p>
          <h2>Informacoes do aluno</h2>
        </div>
        <div id="studentInfo"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
